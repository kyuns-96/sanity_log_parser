# Optional: mount completed VWP snapshots for explicitly invoked analyze commands.
# Keep these directories in the VWP environment; never mount them on OA.
services:
  vwp-bridge:
    volumes:
      - type: bind
        source: ${VWP_BRIDGE_SNAPSHOT_DIR:?Set an absolute path to completed VWP snapshots}
        target: /data/snapshots
        read_only: true
        bind:
          create_host_path: false
