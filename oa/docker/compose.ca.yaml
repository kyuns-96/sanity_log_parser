# Append this override after the base Compose file for a mounted CA bundle.
x-ca: &ca
  volumes:
    - type: bind
      source: ${OA_CA_DIR:?Set an absolute path to the private CA directory}
      target: /run/sanity-ca
      read_only: true
      bind:
        create_host_path: false

services:
  oa:
    <<: *ca
  oa-receiver:
    <<: *ca
