# Unconfigured Host values must not reach the OA backend.
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name "";
    return 400;
}

server {
    listen 8080;
    listen [::]:8080;
    # Replaced by start.py using validated OA_ALLOWED_HOSTS values.
    server_name __OA_SERVER_NAMES__;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # nginx has already checked the public Host. The existing OA API only
        # accepts a loopback Host and does not trust proxy identity headers.
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Connection "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_redirect off;
    }
}
