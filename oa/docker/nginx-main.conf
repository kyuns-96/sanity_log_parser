worker_processes 1;
pid /tmp/sanity-nginx/nginx.pid;
error_log stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_max_body_size 64k;
    client_body_temp_path /tmp/sanity-nginx/client-body;
    proxy_temp_path /tmp/sanity-nginx/proxy;
    fastcgi_temp_path /tmp/sanity-nginx/fastcgi;
    uwsgi_temp_path /tmp/sanity-nginx/uwsgi;
    scgi_temp_path /tmp/sanity-nginx/scgi;

    # start.py renders the explicit host allowlist into this runtime-only file.
    include /tmp/sanity-nginx/server.conf;
}
